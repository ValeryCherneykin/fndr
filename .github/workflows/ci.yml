name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code. A compromised step cannot
# push to the repository or touch releases.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is now outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    # fndr talks to the OS directly (trash, clipboard, opener), so behaviour
    # differs between Linux and macOS and both must be tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the go directive in go.mod.
          go-version-file: go.mod

      # zsh, bash and fish each get a real run of fndr's shell function
      # (internal/shell); a shell that is missing is skipped, so install
      # the two a Linux runner lacks.
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin the linter so new releases cannot break CI unannounced;
          # Dependabot does not bump this, update it by hand.
          version: v2.15.0
