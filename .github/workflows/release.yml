name: Release

on:
  push:
    tags: ["v*"]

# Creating the GitHub release needs write access to this repository; the
# Homebrew tap is written with its own token (HOMEBREW_TAP_TOKEN).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the full history and tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Lint already ran in CI on the tagged commit; tests run once more on
      # exactly what is about to ship.
      - run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
